name: Public Judgment E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/public-judgment-e2e.yml"
      - "pyproject.toml"
      - "scripts/validate_public_judgments.py"
      - "src/data_processing/judgment_processor.py"
      - "src/vectorstore/**"
      - "src/chains/retrieval_chain.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MISTRAL_API_KEY: validation-placeholder
      HUGGINGFACE_API_KEY: validation-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Resolve and install dependencies
        run: |
          uv lock
          uv sync --group dev

      - name: Download public Supreme Court judgments
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .validation/pdfs

          curl -fL --retry 3 --retry-delay 2 \
            "https://www.supremecourt.gov.bd/resources/documents/3425449_Death_Ref_106of2018.pdf" \
            -o .validation/pdfs/death_ref_106_2018.pdf

          curl -fL --retry 3 --retry-delay 2 \
            "https://www.supremecourt.gov.bd/resources/documents/2335716_Death_Reference_No_117_of_20217.pdf" \
            -o .validation/pdfs/death_ref_117_2017.pdf

          curl -fL --retry 3 --retry-delay 2 \
            "https://www.supremecourt.gov.bd/resources/documents/2102148_civil_revision_no_205_2021_dt_22_4_24.pdf" \
            -o .validation/pdfs/civil_revision_205_2021.pdf

          curl -fL --retry 3 --retry-delay 2 \
            "https://www.supremecourt.gov.bd/resources/documents/2027591_Cril_Rev_No_3346_of_2022.pdf" \
            -o .validation/pdfs/criminal_appeal_3346_2022.pdf

          file .validation/pdfs/*.pdf
          du -h .validation/pdfs/*.pdf

      - name: Validate full downstream handoff
        run: |
          uv run python scripts/validate_public_judgments.py \
            .validation/pdfs \
            --work-dir .validation/work \
            --output .validation/report.json

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-judgment-e2e-report
          path: |
            .validation/report.json
            uv.lock
          if-no-files-found: warn
