name: Refresh lockfile (temporary)

on:
  push:
    branches:
      - feat/public-judgment-e2e-validation

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      MISTRAL_API_KEY: lock-placeholder
      HUGGINGFACE_API_KEY: lock-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/public-judgment-e2e-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Regenerate lockfile
        run: uv lock
      - name: Commit lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: refresh uv lockfile"
          git push origin HEAD:feat/public-judgment-e2e-validation
