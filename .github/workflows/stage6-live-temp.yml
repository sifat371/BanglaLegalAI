name: Stage 6 Live Check (temporary)

on:
  push:
    branches:
      - feat/reviewer-benchmark-stage6

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      HUGGINGFACE_API_KEY: benchmark-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install locked dependencies
        run: |
          uv lock --check
          uv sync --locked --group dev

      - name: Run live benchmark when secret exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark_results
          if [ -z "${MISTRAL_API_KEY}" ]; then
            echo '{"status":"skipped","reason":"MISTRAL_API_KEY repository secret is not configured"}' > benchmark_results/live_status.json
            echo "Live Stage 6 benchmark skipped: MISTRAL_API_KEY secret is not configured."
            exit 0
          fi

          uv run python scripts/evaluate_claim_support_benchmark.py \
            --run-model \
            --prediction-output benchmark_results/claim_support_predictions.jsonl \
            --report-output benchmark_results/claim_support_report.json
          echo '{"status":"completed"}' > benchmark_results/live_status.json

      - name: Upload Stage 6 live artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage6-live-check
          path: benchmark_results/
          if-no-files-found: error
