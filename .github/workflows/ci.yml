name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MISTRAL_API_KEY: test-key
      HUGGINGFACE_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Verify lockfile
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Syntax check
        run: uv run python -m compileall -q src tests scripts
      - name: Ruff integration modules
        run: uv run ruff check src/data_processing/judgment_processor.py src/vectorstore/document_identity.py src/chains/citation_verifier.py src/chains/claim_support.py src/chains/grounding_enforcer.py
      - name: Tests
        run: uv run pytest
