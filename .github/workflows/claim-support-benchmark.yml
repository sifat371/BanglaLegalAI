name: Claim Support Benchmark

on:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      HUGGINGFACE_API_KEY: benchmark-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Verify and install locked dependencies
        run: |
          uv lock --check
          uv sync --locked --group dev

      - name: Require Mistral secret
        shell: bash
        run: |
          if [ -z "${MISTRAL_API_KEY}" ]; then
            echo "Repository secret MISTRAL_API_KEY is required for live benchmark evaluation."
            exit 1
          fi

      - name: Run current claim-support evaluator
        run: |
          uv run python scripts/evaluate_claim_support_benchmark.py \
            --run-model \
            --prediction-output benchmark_results/claim_support_predictions.jsonl \
            --report-output benchmark_results/claim_support_report.json

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claim-support-benchmark-v0.1
          path: benchmark_results/
          if-no-files-found: warn
