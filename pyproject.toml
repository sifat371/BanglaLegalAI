[project]
name = "bangla-legal-ai"
version = "0.1.0"
description = "Bangladesh legal retrieval and grounded AI system built on BanglaLegalIngest"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Legal document ingestion
    "bangla-legal-ingest[manual,bangla]",
    # LangChain ecosystem
    "langchain>=0.3.0",
    "langchain-mistralai>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "langchain-chroma>=0.1.0",
    "langchain-community>=0.3.0",
    "langchain-core>=1.2.7",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.0",
    # Vector store
    "chromadb>=0.5.0",
    # HuggingFace
    "huggingface-hub>=0.25.0",
    # Retrieval
    "rank-bm25>=0.2.2",
    # UI
    "streamlit>=1.38.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tiktoken>=0.7.0",
    "httpx>=0.27.0",
    "tqdm>=4.66.0",
]

[tool.uv.sources]
bangla-legal-ingest = { git = "https://github.com/sifat371/BanglaLegalIngest.git", rev = "e01dd0534761d1d5c0f0b55def82dd76ab802851" }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
